# ============================================================================
#  Nova WARP Worker  —  Cloudflare Worker configuration
#  راهنمای کامل فارسی: README.fa.md   |   راهنمای نصب گام‌به‌گام: DEPLOY.fa.md
# ============================================================================

name = "nova-warp"
main = "src/index.ts"
compatibility_date = "2025-08-01"

# node:tls برای هندشیک TLS شبیه‌ساز اندروید (مسیر پشتیبان ثبت‌نام WARP).
# بدون این فلگ، Worker فقط از مسیر fetch استفاده می‌کند و اگر کلادفلر درخواست را
# محدود کند، ثبت‌نام با خطای kind="blocked" گزارش می‌شود.
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# ---------------------------------------------------------------------------
#  متغیرها (Variables)
#  مقادیر حساس را با secret بگذارید تا در دیف‌ها/لاگ‌ها دیده نشوند:
#      npx wrangler secret put PANEL_PASSWORD
#      npx wrangler secret put SESSION_SECRET
#      npx wrangler secret put API_KEY
# ---------------------------------------------------------------------------
[vars]
# --- ظاهر پنل ---
# PANEL_TITLE = "Nova WARP"          # عنوان پنل
# PANEL_LANG = "fa"                  # fa | en

# --- امنیت (روی wrangler secret بگذارید، نه اینجا) ---
# PANEL_PASSWORD = "یک-رمز-قوی"      # اگر نباشد، بار اول صفحه‌ی /setup نمایش داده می‌شود
# SESSION_SECRET = "رشته‌ی-تصادفی-بلند"  # امضای کوکی نشست (اختیاری ولی توصیه‌شده)
# API_KEY = "nw_..."                 # کلید ثابت برای اتوماسیون/API (اختیاری)
# PASSWORD_ITERATIONS = "10000"      # هزینه‌ی PBKDF2 (پیش‌فرض 10000)

# --- تنظیمات WARP ---
# API_VERSION = "v0a5641"            # نسخه‌ی API اندروید کلادفلر
# TEAM_TOKEN = ""                    # توکن Zero Trust برای ثبت‌نام روی تیم شما
# MAX_REGISTRATIONS_PER_HOUR = "6"   # سهمیه‌ی ساخت هویت جدید در ساعت

# --- دیباگ/تست ---
# DEMO_MODE = "0"                    # "1" = هویت جعلی، بدون تماس با API کلادفلر
# DISABLE_RAW_TLS = "0"              # "1" = غیرفعال‌کردن مسیر پشتیبان node:tls

# ---------------------------------------------------------------------------
#  ذخیره‌سازی — KV (اجباری)
#  ۱) بسازید:      npx wrangler kv namespace create WARP_KV
#  ۲) شناسه‌ی خروجی را جای مقدار زیر بگذارید
#  ۳) سپس:         npx wrangler deploy
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "WARP_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
#  مسیر اختصاصی (اختیاری)
# ---------------------------------------------------------------------------
# [[routes]]
# pattern = "warp.example.com"
# custom_domain = true

# ---------------------------------------------------------------------------
#  Observability (اختیاری)
# ---------------------------------------------------------------------------
[observability]
enabled = true

# ---------------------------------------------------------------------------
#  محیط محلی:  npm run dev   (از KV محلی استفاده می‌کند، بدون نیاز به id واقعی)
# ---------------------------------------------------------------------------
[env.local]
[[env.local.kv_namespaces]]
binding = "WARP_KV"
id = "local-dev"
